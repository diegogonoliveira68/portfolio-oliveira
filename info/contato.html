  <input type="text" id="email" placeholder="Digite seu email" /> <!--inserir a opção para digitar o email-->
  
  <button onclick="validarEEnviar()">Enviar</button> <!--Adicionar o botão e fazer a verificação-->
  
  <p id="resultado"></p>

  <script>
  
    function validarEmail(email) {   //função para realizar a verificação
      const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;//deve conter o @ e o ponto(.)
      return regex.test(email);
    }

    function validarEEnviar() {
      const email = document.getElementById('email').value.trim();//no campo de digitação remove espaços extras
      
      const resultado = document.getElementById('resultado');

      if (validarEmail(email)) { //simulação de envio caso o email estiver correto
        console.log('Simulação de envio para:', email);//mostra que o email foi enviado
        
        resultado.textContent = 'Email válido!';//se o email estiver certo aparecerá a mensagem de confirmação
      } else {
        resultado.textContent = 'Email inválido, tente novamente!';//caso esteja errado pedirá para inserir novamente
      }
    }
  </script>
